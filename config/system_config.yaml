# system_config.yaml - SINGLE source of truth for all tunable parameters
# Any TBD value is explicitly commented with its corresponding Open Question in architecture.md

sensor:
  sample_rate_hz: 100.0
  i2c_clock_hz: 400000
  accel_range_g: 2.0
  gyro_range_dps: 250.0

signal:
  tremor_band_hz: [4.0, 12.0]
  voluntary_band_hz: [0.5, 4.0]
  filter_order: 4           # v1: fourth-order Butterworth; alternatives: 2 or 6
  window_length_s: 2.0      # v1: 200 samples at 100 Hz; alternatives: 1.0 or 1.5 s
  window_overlap_pct: 50.0  # v1: 100-sample step for 200-sample windows
  axis_strategy: "per_axis" # v1 default: per-axis analysis. Options: "per_axis", "magnitude", "strongest_axis" (Feature 15)

ml:
  confidence_threshold: 0.6  # v1 provisional — TBD Open Question #5; ML detection confidence gate for controller
  random_seed: 42

controller:
  severity_threshold: 0.3    # v1 provisional — TBD Open Question #5; enter-threshold for mitigation
  target_suppression_pct: 50.0
  suppression_tolerance_pct: 5.0   # v1 provisional — TBD; ±band around target within which adaptation.py maintains (separate from hysteresis_pct, which gates mitigate on/off)
  hysteresis_pct: 10.0       # v1 provisional — TBD Open Question #5; exit = severity_threshold - hysteresis_pct/100
  max_delta_per_step:              # v1 provisional — TBD Open Question #5; per-field cap per adaptation cycle (per-parameter units, matches param_bounds structure)
    amplitude:          0.5        # 10% of [0, 5] range
    pulse_frequency_hz: 5.0        # ~6% of [20, 100] range
    pulse_width_us:     25.0       # ~6% of [50, 500] range
    duty_cycle:         0.05       # 10% of [0, 0.5] range
    on_time_ms:         25.0       # ~6% of [50, 500] range
    off_time_ms:        25.0       # ~6% of [50, 500] range
  param_bounds:              # v1 provisional — TBD Open Question #7; all ranges to be validated experimentally
    amplitude:
      min: 0.0
      max: 5.0
    pulse_frequency_hz:
      min: 20.0
      max: 100.0
    pulse_width_us:
      min: 50.0
      max: 500.0
    duty_cycle:
      min: 0.0
      max: 0.5
    on_time_ms:
      min: 50.0
      max: 500.0
    off_time_ms:
      min: 50.0
      max: 500.0

simulation:
  timestep_s: 0.001          # v1 provisional: 1 ms integration ceiling; validate experimentally
  latency_ms: 50.0           # v1 provisional: 50 ms actuation delay; validate experimentally

estimation:
  phase_enabled: false       # Feature 31: advanced/experimental phase estimation, disabled by default
